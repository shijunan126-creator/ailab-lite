  <alias><family>黑体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>仿宋</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>仿宋_GB2312</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>FangSong</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>楷体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>楷体_GB2312</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>KaiTi</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>方正小标宋简体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>方正小标宋_GBK</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
</fontconfig>
