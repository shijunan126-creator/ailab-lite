name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: ailab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Exercise the real RedisQueue branch (the default run skips it).
      AILAB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/constraints.txt
      - name: Lockfile is consistent with pyproject.toml
        run: bash scripts/lock_deps.sh --check
      - name: Install (pinned)
        run: pip install -c constraints.txt -e '.[dev,postgres]'
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Tests (SQLite, real Redis)
        run: pytest -q --cov=ailab_platform --cov-report=term-missing
      - name: Tests on PostgreSQL (whole suite + migrations)
        run: |
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE ailab_mig'
          AILAB_TEST_DATABASE_URL=postgresql+psycopg://postgres:pg@127.0.0.1:5432/ailab \
          AILAB_TEST_POSTGRES_URL=postgresql+psycopg://postgres:pg@127.0.0.1:5432/ailab_mig \
          pytest -q --no-cov

  storage-contracts:
    # Separate from PG/Redis/E2E so a small runner can run one group at a time.
    needs: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      AILAB_TEST_S3_URL: http://127.0.0.1:19450
      AILAB_TEST_S3_ACCESS_KEY: contract-access
      AILAB_TEST_S3_SECRET_KEY: contract-secret-local-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e '.[dev]'
      - name: MinIO service container (contract fixture only)
        run: |
          docker run -d --name contract-minio -p 127.0.0.1:19450:9000 \
            -e MINIO_ROOT_USER="$AILAB_TEST_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$AILAB_TEST_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:19450/minio/health/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:19450/minio/health/ready
      - run: pytest tests/contracts/test_storage.py -ra
      - name: Stop service container
        if: always()
        run: docker rm -f contract-minio

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Kustomize overlays
        run: |
          kubectl kustomize platform/deploy/overlays/dev > /tmp/dev.yaml
          kubectl kustomize platform/deploy/overlays/lite > /tmp/lite.yaml
          kubectl kustomize deploy/overlays/lite > /tmp/sandbox.yaml
      - name: ShellCheck
        run: shellcheck -S warning deploy.sh tests/*.sh platform/scripts/*.sh

  e2e:
    # The Portal and the services in a real browser: login, running a task and its SSE timeline, downloads,
    # the quarantine of infected uploads, and that the access token never reaches page scripts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AILAB_E2E: "1"
      AILAB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/portal/package-lock.json
      - name: Install
        working-directory: platform
        run: pip install -c constraints.txt -e '.[dev,e2e]'
      - name: Portal dependencies
        working-directory: platform/portal
        run: npm ci --no-audit --no-fund
      - name: Chromium
        run: playwright install --with-deps chromium
      - name: Browser tests
        working-directory: platform
        run: pytest e2e -q
      - name: Service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: platform/e2e-logs
