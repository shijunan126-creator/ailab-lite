name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.scope.outputs.code }}
      backend: ${{ steps.scope.outputs.backend }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s .github/tests
      - id: scope
        run: python3 .github/scripts/ci_scope.py

  quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/constraints.txt
      - run: bash scripts/lock_deps.sh --check
      - run: pip install -c constraints.txt -e '.[dev]'
      - run: ruff check --config pyproject.toml . ../.github && ruff format --config pyproject.toml --check . ../.github
      - run: python scripts/check_imports.py
      - run: python scripts/check_skills.py
      - run: python tests/golden/run.py --self-test
      - name: Import services with only production dependencies
        env:
          AILAB_ENV_FILE: /tmp/ailab-ci-no-env
          AILAB_DATA_DIR: ${{ runner.temp }}/runtime-data
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/pip" install -c constraints.txt '.[postgres,opensandbox]'
          "$RUNNER_TEMP/runtime/bin/python" scripts/check_imports.py

  python:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    defaults:
      run:
        working-directory: platform
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: ailab
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AILAB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      AILAB_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:pg@127.0.0.1:5432/ailab' || '' }}
      AILAB_TEST_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:pg@127.0.0.1:5432/ailab_mig' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/constraints.txt
      - run: pip install -c constraints.txt -e '.[dev,postgres]'
      - name: PostgreSQL client and migration database
        if: matrix.database == 'postgres'
        run: |
          test -x /usr/lib/postgresql/16/bin/pg_dump
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          PGPASSWORD=pg /usr/lib/postgresql/16/bin/psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE ailab_mig'
      - name: Tests (SQLite coverage / PostgreSQL full suite)
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          mkdir -p test-results
          args=()
          if [ "$DATABASE" = sqlite ]; then
            args+=(--cov=ailab_platform --cov-report=term-missing --cov-report=xml:test-results/coverage.xml)
          fi
          pytest tests -ra --durations=10 --junitxml=test-results/results.xml "${args[@]}"
      - name: Require real database and queue coverage
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          args=(--require 'contracts.test_queue::.*\[redis\]$')
          if [ "$DATABASE" = postgres ]; then
            args+=(--require 'contracts.test_database::.*\[postgres\]$' --require 'contracts.test_ledger_database::' --require 'contracts.test_backup::test_postgres' --require 'tests.test_migrations::')
          fi
          python ../.github/scripts/verify_junit.py test-results/results.xml "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-${{ matrix.database }}
          path: platform/test-results/
          retention-days: 7

  storage-contracts:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    env:
      AILAB_TEST_S3_URL: http://127.0.0.1:19450
      AILAB_TEST_S3_ACCESS_KEY: contract-access
      AILAB_TEST_S3_SECRET_KEY: contract-secret-local-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/constraints.txt
      - run: pip install -c constraints.txt -e '.[dev]'
      - name: Fixture binary directory
        run: echo "CI_MINIO_DIR=$RUNNER_TEMP/minio-bin" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        id: minio
        with:
          path: ${{ runner.temp }}/minio-bin
          key: minio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/scripts/ci_minio.sh') }}
      - uses: actions/setup-go@v7
        if: steps.minio.outputs.cache-hit != 'true'
        with:
          go-version: '1.24.2'
          cache: false
      - name: Build fixed MinIO source (cold cache only)
        if: steps.minio.outputs.cache-hit != 'true'
        run: bash scripts/ci_minio.sh
      - name: Start real MinIO
        env:
          MINIO_ROOT_USER: ${{ env.AILAB_TEST_S3_ACCESS_KEY }}
          MINIO_ROOT_PASSWORD: ${{ env.AILAB_TEST_S3_SECRET_KEY }}
          MINIO_BROWSER: 'off'
        run: |
          mkdir -p test-results
          "$CI_MINIO_DIR/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:19450 > test-results/minio.log 2>&1 &
          echo "MINIO_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 "$AILAB_TEST_S3_URL/minio/health/ready" && break
            sleep 1
          done
          curl -fsS --max-time 2 "$AILAB_TEST_S3_URL/minio/health/ready"
      - run: pytest tests/contracts/test_storage.py -ra --junitxml=test-results/storage.xml
      - name: Require S3 cases to run
        run: >-
          python ../.github/scripts/verify_junit.py test-results/storage.xml
          --require 'contracts.test_storage::.*\[s3\]$'
          --allow-skip '::test_copy_pins_source_before_concurrent_replacement\[s3\]$'
      - name: Stop service
        if: always()
        run: if [ -n "${MINIO_PID:-}" ]; then kill "$MINIO_PID"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-contracts
          path: platform/test-results/
          retention-days: 7

  shell:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Workflow syntax and expressions
        run: docker run --rm -v "$PWD:/work" -w /work rhysd/actionlint:1.7.12 -color
      - name: ShellCheck and Kustomize overlays
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          kubectl kustomize platform/deploy/overlays/dev > /tmp/dev.yaml
          kubectl kustomize platform/deploy/overlays/lite > /tmp/lite.yaml
          kubectl kustomize deploy/overlays/lite > /tmp/sandbox.yaml
          git ls-files -z '*.sh' | xargs -0 shellcheck -s bash -S warning
          shellcheck -S warning images/sbx-office/smoke/smoke.sh
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')

  e2e:
    # The fixture owns Portal Node tests + an isolated production build, avoiding a duplicate build job.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AILAB_E2E: "1"
      AILAB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/portal/package-lock.json
      - name: Install
        working-directory: platform
        run: pip install -c constraints.txt -e '.[dev,e2e]'
      - name: Portal dependencies
        working-directory: platform/portal
        run: npm ci --no-audit --no-fund
      - name: Chromium
        working-directory: platform
        run: |
          # The Azure HTTP mirror can consume the job budget before browser tests start.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          playwright install --with-deps chromium
      - name: Browser tests (includes Portal tests/build)
        working-directory: platform
        run: pytest e2e -ra --durations=10 --junitxml=test-results/e2e.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e
          path: |
            platform/test-results/
            platform/e2e-logs/
          retention-days: 7

  ci:
    # Keep one stable required check, including documentation-only PRs and failed dependency jobs.
    name: CI
    needs: [changes, quality, python, storage-contracts, shell, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Require selected suites to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py
