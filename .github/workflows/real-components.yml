name: Real component contracts

# Heavy disposable fixtures are kept off the per-PR critical path.
on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-components-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.component == 'office' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        component: [docker, office, clamd, keycloak]
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: platform
    env:
      AILAB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/constraints.txt
      - run: pip install -c constraints.txt -e '.[dev,e2e]'
      - name: Docker fixture
        if: matrix.component == 'docker' || matrix.component == 'office'
        run: |
          if [ "$COMPONENT" = office ]; then
            docker build -t ailab-contract:ci ../images/sbx-office
            mkdir -p test-results
            timeout 600s docker run --name ci-office --network none --memory 2g --memory-swap 2g \
              --cpus 1 --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges \
              ailab-contract:ci sh /opt/ailab-tools/smoke/smoke.sh | tee test-results/office-smoke.log
            grep -q 'SMOKE PASS' test-results/office-smoke.log
            if grep -q NET_OPEN test-results/office-smoke.log; then
              exit 1
            fi
          else
            docker build -f ../.github/fixtures/Dockerfile.sandbox -t ailab-contract:ci ..
          fi
          echo AILAB_SANDBOX_IMAGE=ailab-contract:ci >> "$GITHUB_ENV"
          echo AILAB_TEST_DOCKER=1 >> "$GITHUB_ENV"
      - name: ClamAV fixture
        if: matrix.component == 'clamd'
        run: |
          docker run -d --name ci-component --memory 2g -p 127.0.0.1:13310:3310 \
            clamav/clamav-debian@sha256:d7ede3cefeaf3b8a72ebcdee849d13f504bbca3f3b3cfade5bc7b6ee06a4f62c
          echo AILAB_TEST_CLAMD=tcp://127.0.0.1:13310 >> "$GITHUB_ENV"
      - name: Keycloak fixture
        if: matrix.component == 'keycloak'
        run: |
          playwright install --with-deps chromium
          docker run -d --name ci-component --memory 1g -p 127.0.0.1:18080:8080 \
            -v "$GITHUB_WORKSPACE/.github/fixtures/ci-realm.json:/opt/keycloak/data/import/ci-realm.json:ro" \
            quay.io/keycloak/keycloak:26.6.4 start-dev --import-realm
          {
            echo AILAB_TEST_OIDC_ISSUER=http://127.0.0.1:18080/realms/ci
            echo AILAB_TEST_OIDC_USERNAME=ci-user
            echo AILAB_TEST_OIDC_PASSWORD=disposable-ci-password
          } >> "$GITHUB_ENV"
      - name: Wait for component and run contracts
        run: |
          mkdir -p test-results
          if [ "$COMPONENT" = docker ] || [ "$COMPONENT" = office ]; then
            extra=()
            if [ "$COMPONENT" = office ]; then
              extra+=(tests/contracts/test_skill_sandbox.py)
            fi
            pytest tests/contracts/test_sandbox_lifecycle.py tests/contracts/test_sandbox_transfer.py \
              tests/faults/test_real_broker_recovery.py "${extra[@]}" -k docker -ra --junitxml=test-results/component.xml
          elif [ "$COMPONENT" = clamd ]; then
            python scripts/ci_wait_component.py clamd
            pytest tests/contracts/test_clamd.py -ra --junitxml=test-results/component.xml
          else
            python scripts/ci_wait_component.py keycloak
            pytest tests/contracts/test_keycloak_identity.py -ra --junitxml=test-results/component.xml
          fi
          python ../.github/scripts/verify_junit.py test-results/component.xml --require '.*'
      - name: Diagnostics and cleanup
        if: always()
        run: |
          mkdir -p test-results
          docker logs ci-component > test-results/component.log 2>&1 || true
          docker stats --no-stream > test-results/resources.txt || true
          docker inspect ci-office > test-results/office-container.json 2>/dev/null || true
          docker rm -f ci-component ci-office 2>/dev/null || true
          ids=$(docker ps -aq --filter name=ailab-sbx-)
          if [ -n "$ids" ]; then
            echo "$ids" | xargs docker rm -f
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-${{ matrix.component }}
          path: platform/test-results/
          retention-days: 7
