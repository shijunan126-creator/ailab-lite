# Models users can pick in the Portal.
#
# The user sees only `id`, `name`, `description` and `weight`. Where the model really runs
# (`base_url`, `upstream_model`) and which key reaches it stay on the server.
#
# A key never appears in this file: `api_key_env` names an environment variable (it must start with
# AILAB_KEY_) that holds it - a Kubernetes Secret entry, or platform/.env on a dev machine. A model
# whose key is missing is hidden from users instead of failing when someone picks it.
#
# Adding a model later (e.g. one served by GPUStack behind Higress) is one more [[models]] block:
# point base_url at the gateway and make upstream_model the alias the gateway routes on.
#
#   id              what users select and what runs/usage records store (letters, digits . _ -)
#   provider        "openai" = any OpenAI-compatible chat API (DeepSeek, Higress, vLLM...) | "mock"
#   weight          quota multiplier: a call costs tokens x weight against the daily/monthly limits
#   echo_reasoning  true for thinking models that demand reasoning_content back on tool turns (DeepSeek V4.x)
#   disable_reasoning_for_quiet true only when the provider supports thinking.type=disabled (titles/summaries)
#   fallback        ordered aliases, tried only before any output (never silently fall back to mock)
#   context_tokens  model context window; input assembly uses at most 70 percent
#   max_output_tokens per-call output capacity, including reasoning; also used for the usage reservation
#   AILAB_MODEL_MAX_OUTPUT_TOKENS can optionally impose a smaller operator ceiling.
#   capabilities    tools, vision and/or genui; omitted preserves the legacy tools flag
#   default         the model preselected for new runs (exactly one, or the first one is used)

[[models]]
id = "deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash"
description = "速度快、成本低，适合日常任务与工具调用。"
provider = "openai"
base_url = "https://api.deepseek.com"
api_key_env = "AILAB_KEY_DEEPSEEK"
upstream_model = "deepseek-flash"
weight = 1
fallback = []
# DeepSeek Flash limits: https://api-docs.deepseek.com/quick_start/pricing/
context_tokens = 1048576
max_output_tokens = 393216
capabilities = ["tools", "vision", "genui"]
echo_reasoning = true
disable_reasoning_for_quiet = true
default = true

[[models]]
id = "ailab-demo"
name = "离线演示"
description = "不调用任何模型，按固定脚本演示完整链路；不花 token，可离线使用。"
provider = "mock"
weight = 0.1
fallback = []
context_tokens = 32768
max_output_tokens = 8192
capabilities = ["tools", "genui"]
