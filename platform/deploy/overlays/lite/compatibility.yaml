apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-broker
  namespace: platform
spec:
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform
spec:
  template:
    spec:
      containers:
      - name: api
        env:
        - name: PGPASSWORD
          $patch: delete
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform
data:
  AILAB_DATABASE_URL: sqlite:////data/platform.db
  AILAB_OSB_DOMAIN: 127.0.0.1:8090
  AILAB_OSB_NETWORK_MODE: kubernetes
  # A sandbox pod requests this whole value, and the lite target is a 2-vCPU node where the
  # platform pods leave ~800m allocatable: at the 1-CPU default the scheduler can never place
  # one ("Insufficient cpu"), so every sandbox-acquire 502s after a 60s pod-ready timeout.
  AILAB_SANDBOX_CPU: "0.75"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-postgres
  namespace: platform
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: platform-postgres
  namespace: platform
$patch: delete
