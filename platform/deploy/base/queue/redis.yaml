apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-redis
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-redis
  template:
    metadata:
      labels:
        app: platform-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args:
        - redis-server
        - --save
        - ''
        - --appendonly
        - 'no'
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: platform-redis
  namespace: platform
spec:
  selector:
    app: platform-redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
