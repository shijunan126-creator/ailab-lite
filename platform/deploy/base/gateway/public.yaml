apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-public-proxy
  namespace: platform
data:
  nginx.conf: "events { worker_connections 256; }\nhttp {\n  access_log off;\n  server\
    \ {\n    listen 8080;\n    client_max_body_size 51m;\n    location /v1/ {\n  \
    \    proxy_pass http://platform-api:8080;\n      proxy_buffering off;\n      proxy_read_timeout\
    \ 1000s;\n    }\n    location = /healthz { proxy_pass http://platform-api:8080;\
    \ }\n    location = /readyz { proxy_pass http://platform-api:8080; }\n    location\
    \ / { return 404; }\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-public
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-public
  template:
    metadata:
      labels:
        app: platform-public
    spec:
      containers:
      - name: gateway
        image: nginx:1.28-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 48Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
      volumes:
      - name: config
        configMap:
          name: platform-public-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: platform-public
  namespace: platform
spec:
  selector:
    app: platform-public
  ports:
  - name: http
    port: 8080
    targetPort: 8080
