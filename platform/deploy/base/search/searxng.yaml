# Private metasearch for the Agent. It is the only component that talks to
# public search engines; the sandbox keeps its default-deny egress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-searxng
  namespace: platform
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: "AILab Search"
    search:
      safe_search: 0
      formats:
        - html
        - json
    server:
      secret_key: "ailab-lite-searxng-change-me"
      limiter: false
      public_instance: false
      image_proxy: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-searxng
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform-searxng}
  template:
    metadata:
      labels: {app: platform-searxng}
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_BASE_URL
              value: http://platform-searxng:8080/
          ports: [{containerPort: 8080}]
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: settings
          configMap: {name: platform-searxng}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-searxng
  namespace: platform
spec:
  selector: {app: platform-searxng}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
