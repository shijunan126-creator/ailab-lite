apiVersion: v1
kind: Service
metadata:
  name: platform-postgres
  namespace: platform
spec:
  selector:
    app: platform-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-postgres
  namespace: platform
spec:
  serviceName: platform-postgres
  replicas: 1
  selector:
    matchLabels:
      app: platform-postgres
  template:
    metadata:
      labels:
        app: platform-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: ailab
        - name: POSTGRES_DB
          value: ailab
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-database
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: database
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 384Mi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - ailab
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: database
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 4Gi
