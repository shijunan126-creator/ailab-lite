apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: fix-data-perms
        image: ailab-platform:lite
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - mkdir -p /data/storage && chown 10001:10001 /data /data/storage
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: api
        image: ailab-platform:lite
        imagePullPolicy: Never
        command:
        - uvicorn
        - ailab_platform.api.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        envFrom:
        - configMapRef:
            name: platform-config
        - configMapRef:
            name: platform-auth
            optional: true
        - secretRef:
            name: platform-secrets
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: data
          mountPath: /data
        - name: models
          mountPath: /etc/ailab
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-database
              key: password
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-data
      - name: models
        configMap:
          name: platform-models
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform
spec:
  selector:
    app: platform-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
