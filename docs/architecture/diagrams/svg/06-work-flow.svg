<text x="572.0" y="848.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">16</text>
<text x="590.0" y="849.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">deliver_file → 归档 outputs/</text>
<path d="M740.0,902.0 L344.0,902.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
