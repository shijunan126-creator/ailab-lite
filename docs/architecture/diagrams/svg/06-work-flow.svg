<path d="M756.0,948.0 L1358.0,948.0" fill="none" stroke="#15803d" stroke-width="1.7" marker-end="url(#m15803d)"/>
<circle cx="778" cy="936" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="778.0" y="940.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">18</text>
<text x="796.0" y="941.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">写入 report.pptx v1（流式）</text>
<path d="M740.0,994.0 L344.0,994.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
<circle cx="366" cy="982" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="366.0" y="986.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">19</text>
<text x="384.0" y="987.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">确认登记 · 关联会话（/internal/files/commit）</text>
<path d="M534.0,1040.0 L344.0,1040.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
<circle cx="366" cy="1028" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="366.0" y="1032.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">20</text>
<text x="384.0" y="1033.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">消息 · Run 状态 · 每次 LLM 调用的账本（/internal/*）</text>
<path d="M328.0,1086.0 L138.0,1086.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
<circle cx="160" cy="1074" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="160.0" y="1078.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">21</text>
<text x="178.0" y="1079.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">产出卡片：预览 / 下载（预签名 GET）</text>
<path d="M756.0,1132.0 L946.0,1132.0" fill="none" stroke="#dc2626" stroke-width="1.7" marker-end="url(#mdc2626)"/>
<circle cx="778" cy="1120" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="778.0" y="1124.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">22</text>
<text x="796.0" y="1125.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">15 min 无活动 → 销毁沙箱</text>
<rect x="470" y="642" width="990" height="184" rx="8" ry="8" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1440.0" y="660.0" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="end" style="white-space:pre">Agent 循环（多轮）</text>
<text x="1440.0" y="680.0" font-size="11.5" font-weight="400" fill="#4f46e5" text-anchor="end" style="white-space:pre">每次工具调用都续租沙箱</text>
<rect x="20" y="1182" width="1460" height="90" rx="10" ry="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
<text x="40.0" y="1210.0" font-size="12.8" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">要点：① 沙箱懒创建（第 7 步才领取）　② 模型调用全部在沙箱外（第 5、13、15 步）　③ 文件字节不经 Platform API：浏览器经 Higress 直传 S3（第 2 步），沙箱侧由 Broker 中转（第 11、18 步）</text>
<text x="40.0" y="1234.0" font-size="12.8" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">④ 权限和配额只在 Platform API 判定（第 4、10、17 步），Broker 和 Agent Service 只拿校验过的结果</text>
<text x="40.0" y="1258.0" font-size="12.8" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">⑤ 沙箱销毁后会话仍在，下次进入会重新领取沙箱并注入 v1，在其基础上继续修改</text>
</svg>
