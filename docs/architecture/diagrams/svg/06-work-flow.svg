<text x="590.0" y="803.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">inspect_visual：多模态检查版式</text>
<path d="M550.0,856.0 L740.0,856.0" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#m475569)"/>
