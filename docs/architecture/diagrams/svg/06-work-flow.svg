<text x="384.0" y="573.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">取本会话文件清单（/internal/…/materials，校验归属）</text>
<path d="M1358.0,626.0 L962.0,626.0" fill="none" stroke="#15803d" stroke-width="1.7" marker-end="url(#m15803d)"/>
