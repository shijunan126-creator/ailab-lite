<text x="178.0" y="389.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">SSE：思考过程、计划卡片（Agent 事件 → Valkey → Platform API）</text>
<path d="M550.0,442.0 L740.0,442.0" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#m475569)"/>
