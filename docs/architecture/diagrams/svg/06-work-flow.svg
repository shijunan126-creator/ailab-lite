<text x="572.0" y="664.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">12</text>
<text x="590.0" y="665.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">load_skill pptx-builder · 运行脚本</text>
<path d="M550.0,718.0 L1152.0,718.0" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#m2563eb)"/>
<circle cx="572" cy="706" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="572.0" y="710.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">13</text>
<text x="590.0" y="711.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">LLM：每一步决定下一个工具</text>
<path d="M550.0,764.0 L946.0,764.0" fill="none" stroke="#0e7490" stroke-width="1.7" marker-end="url(#m0e7490)"/>
<circle cx="572" cy="752" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="572.0" y="756.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">14</text>
<text x="590.0" y="757.0" font-size="12.3" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">render_preview → PNG</text>
<path d="M550.0,810.0 L1152.0,810.0" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#m2563eb)"/>
