<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="m2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="m475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="m7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="mc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="1500" height="1260" fill="#ffffff"/>
<text x="30.0" y="42.0" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" style="white-space:pre">一条消息的完整链路：身份、推理、流式回复、记账</text>
<text x="602.0" y="42.0" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start" style="white-space:pre">例：用户在 Chat 里发“帮我总结这份周报”（Agent 多轮时第 9～16 步重复；Work 模式在其间插入沙箱工具调用）</text>
<rect x="30" y="96" width="184" height="44" rx="8" ry="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="122.0" y="119.7" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">浏览器 / Portal</text>
<line x1="122" y1="140" x2="122" y2="1122" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="237" y="96" width="184" height="44" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="329.0" y="119.7" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Higress · 入口路由</text>
<line x1="329" y1="140" x2="329" y2="1122" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="444" y="96" width="184" height="44" rx="8" ry="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="536.0" y="119.7" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Platform API</text>
<line x1="536" y1="140" x2="536" y2="1122" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="651" y="96" width="184" height="44" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="743.0" y="119.7" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Valkey</text>
<line x1="743" y1="140" x2="743" y2="1122" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="858" y="96" width="184" height="44" rx="8" ry="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="950.0" y="119.7" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Agent Service</text>
<line x1="950" y1="140" x2="950" y2="1122" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="1065" y="96" width="184" height="44" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1157.0" y="119.7" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Higress · AI 网关路由</text>
<line x1="1157" y1="140" x2="1157" y2="1122" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="1272" y="96" width="184" height="44" rx="8" ry="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="1364.0" y="119.7" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Worker → vLLM（Atlas）</text>
<line x1="1364" y1="140" x2="1364" y2="1122" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="233" y="64" width="192" height="24" rx="12" ry="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
<text x="329.0" y="81.0" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle" style="white-space:pre">同一套 Higress</text>
<rect x="1061" y="64" width="192" height="24" rx="12" ry="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
<text x="1157.0" y="81.0" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle" style="white-space:pre">同一套 Higress</text>
<path d="M130.0,176.0 L321.0,176.0" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#m2563eb)"/>
<circle cx="152" cy="164" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="152.0" y="168.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">1</text>
<text x="170.0" y="169.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">POST /api/v1/conversations/{id}/messages（带 httpOnly 会话 Cookie）</text>
<path d="M337.0,226.0 L528.0,226.0" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#m475569)"/>
<circle cx="359" cy="214" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="359.0" y="218.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">2</text>
<text x="377.0" y="219.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">TLS 终止 · 按路径转发；不解析 Cookie，不知道用户是谁</text>
<rect x="532" y="262" width="8" height="26" rx="2" ry="2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/>
<circle cx="558" cy="276" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="558.0" y="280.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">3</text>
<text x="576.0" y="281.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">① 确认身份：Cookie → 会话 → user_id；RBAC + 会话归属；额度检查；建 Run</text>
<path d="M544.0,326.0 L735.0,326.0" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#m475569)"/>
<circle cx="566" cy="314" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="566.0" y="318.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">4</text>
<text x="584.0" y="319.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">XADD 队列 {run_id}（Run 记录里已有 user、dept、conversation）</text>
<path d="M528.0,376.0 L130.0,376.0" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#m475569)"/>
<circle cx="152" cy="364" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="152.0" y="368.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">5</text>
<text x="170.0" y="369.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">202 {run_id}（经 Higress 入口返回）</text>
<path d="M130.0,426.0 L528.0,426.0" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#m2563eb)"/>
<circle cx="152" cy="414" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="152.0" y="418.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">6</text>
<text x="170.0" y="419.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">GET /api/v1/runs/{run_id}/events（SSE，同样带 Cookie、校验归属，经 Higress 入口）</text>
<path d="M751.0,476.0 L942.0,476.0" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#m475569)"/>
<circle cx="773" cy="464" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="773.0" y="468.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">7</text>
<text x="791.0" y="469.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">XREADGROUP 领取 run_id</text>
<path d="M942.0,526.0 L544.0,526.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
<circle cx="566" cy="514" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="566.0" y="518.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">8</text>
<text x="584.0" y="519.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">GET /internal/runs/{run_id} → user_id · dept · 会话 · 角色（服务身份：SA Token）</text>
<path d="M958.0,576.0 L1149.0,576.0" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#m2563eb)"/>
<circle cx="980" cy="564" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="980.0" y="568.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">9</text>
<text x="998.0" y="569.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">② POST /v1/chat/completions  model=ailab-chat  stream=true</text>
<rect x="1153" y="612" width="8" height="26" rx="2" ry="2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/>
<circle cx="1179" cy="626" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="1179.0" y="630.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">10</text>
<text x="1141.0" y="631.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="end" style="white-space:pre">Authorization: Bearer &lt;服务 API Key&gt; · x-user-id · x-run-id</text>
<rect x="1153" y="662" width="8" height="26" rx="2" ry="2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/>
<circle cx="1179" cy="676" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="1179.0" y="680.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">11</text>
<text x="1141.0" y="681.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="end" style="white-space:pre">GPUStack 鉴权插件校验服务 API Key（限定可用模型）</text>
<rect x="1153" y="712" width="8" height="26" rx="2" ry="2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/>
<circle cx="1179" cy="726" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="1179.0" y="730.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">12</text>
<text x="1141.0" y="731.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="end" style="white-space:pre">我们加的 ai-token-ratelimit 按 x-user-id 查 TPM</text>
<path d="M1165.0,776.0 L1356.0,776.0" fill="none" stroke="#c2410c" stroke-width="1.7" marker-end="url(#mc2410c)"/>
<circle cx="1187" cy="764" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="1187.0" y="768.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">13</text>
<text x="1205.0" y="769.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">按 model 名路由到实例</text>
<path d="M1356.0,826.0 L958.0,826.0" fill="none" stroke="#c2410c" stroke-width="1.7" marker-end="url(#mc2410c)"/>
<circle cx="980" cy="814" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="980.0" y="818.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">14</text>
<text x="998.0" y="819.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">SSE token 流 …… 最后一个 chunk 带 usage（请求带 include_usage）</text>
<rect x="1153" y="862" width="8" height="26" rx="2" ry="2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/>
<circle cx="1179" cy="876" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="1179.0" y="880.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">15</text>
<text x="1141.0" y="881.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="end" style="white-space:pre">③ 统计插件：用量回传 GPUStack（Key × 模型）；限流计数加上本次 Token</text>
<path d="M942.0,926.0 L751.0,926.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
<circle cx="773" cy="914" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="773.0" y="918.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">16</text>
<text x="791.0" y="919.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">XADD run:{id}:events（token · tool_start · usage …）</text>
<path d="M528.0,976.0 L130.0,976.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
<circle cx="152" cy="964" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="152.0" y="968.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">17</text>
<text x="170.0" y="969.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">Platform API 读 Valkey 事件流 → SSE 推给浏览器（15s 心跳，经 Higress 入口）</text>
<path d="M942.0,1026.0 L544.0,1026.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
<circle cx="566" cy="1014" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="566.0" y="1018.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">18</text>
<text x="584.0" y="1019.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">④ POST /internal/usage {run_id, model, input/cached/output} → usage_ledger</text>
<path d="M942.0,1076.0 L544.0,1076.0" fill="none" stroke="#7c3aed" stroke-width="1.7" marker-end="url(#m7c3aed)"/>
<circle cx="566" cy="1064" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="566.0" y="1068.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" style="white-space:pre">19</text>
<text x="584.0" y="1069.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">PATCH /internal/runs/{id} 完成 · POST …/messages 存回复</text>
<rect x="20" y="1132" width="1460" height="116" rx="10" ry="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
<text x="40.0" y="1160.0" font-size="12.8" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">身份在哪里确认：只有第 3 步（Platform API 校验会话 Cookie）。之后用户身份跟着 run_id 走：Agent Service 凭 run_id 向 Platform API 取用户（第 8 步），</text>
<text x="40.0" y="1182.0" font-size="12.8" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">再以“服务 Key + x-user-id 头”调用模型（第 9～10 步）——Higress 认的是 Agent Service 这个服务，x-user-id 只用来按人限流和打日志标签。</text>
<text x="40.0" y="1206.0" font-size="12.8" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">谁发起推理：Agent Service（Platform API 从不直接调模型）。谁拉起模型：GPUStack 在 Atlas 上启动 vLLM，并把路由写进同一套 Higress（incluster 模式，图中省略）。</text>
<text x="40.0" y="1230.0" font-size="12.8" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">记账以平台账本为准（第 18 步，精确到 Run）；Higress 的 Token 指标只用于对账和防刷（第 12、15 步）。</text>
</svg>
