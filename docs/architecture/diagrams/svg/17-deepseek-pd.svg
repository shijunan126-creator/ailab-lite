<text x="220.0" y="588.0" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" style="white-space:pre">1P1D（本设计）</text>
<text x="560.0" y="588.0" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" style="white-space:pre">混合部署 DP4/TP8/EP32</text>
