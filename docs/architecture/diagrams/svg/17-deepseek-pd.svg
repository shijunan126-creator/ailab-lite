<text x="44.0" y="624.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">输出稳定性（TPOT）</text>
<text x="224.0" y="624.0" font-size="12.5" font-weight="400" fill="#15803d" text-anchor="start" style="white-space:pre">✓ 长 prefill 不打断 decode</text>
<text x="564.0" y="624.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">长上下文请求会让其他人卡顿</text>
<rect x="36" y="644" width="870" height="38" rx="4" ry="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="44.0" y="668.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">首 token（TTFT）</text>
<text x="224.0" y="668.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">P 专心 prefill；多一次 KV 传输</text>
<text x="564.0" y="668.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">与 decode 抢算力</text>
<rect x="36" y="688" width="870" height="38" rx="4" ry="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="44.0" y="712.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">调参</text>
<text x="224.0" y="712.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">P、D 各自调 batch / 并行</text>
<text x="564.0" y="712.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">一套参数折中</text>
<rect x="36" y="732" width="870" height="38" rx="4" ry="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="44.0" y="756.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">并发承载</text>
<text x="224.0" y="756.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">D 侧 KV 空间更大</text>
<text x="564.0" y="756.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">KV 空间被 prefill 挤占</text>
<rect x="36" y="776" width="870" height="38" rx="4" ry="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="44.0" y="800.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">复杂度</text>
<text x="224.0" y="800.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">多一个 Router + KV 传输链路</text>
<text x="564.0" y="800.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">简单</text>
<rect x="36" y="820" width="870" height="38" rx="4" ry="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="44.0" y="844.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">故障域</text>
<text x="224.0" y="844.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">P 或 D 任一台故障 → 整组不可用</text>
<text x="564.0" y="844.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">任一台故障 → 整组不可用</text>
<rect x="940" y="548" width="540" height="336" rx="10" ry="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="954.0" y="572.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">③ 监控与故障处理</text>
<text x="960.0" y="592.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">监控：P 排队 / TTFT · D running / TPOT</text>
<text x="960.0" y="623.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">      KV 传输时延与失败率 · P:D 负载比</text>
