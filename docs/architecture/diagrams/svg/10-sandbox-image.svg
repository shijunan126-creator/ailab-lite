<text x="990.0" y="724.0" font-size="12.2" font-weight="400" fill="#92400e" text-anchor="start" style="white-space:pre">• 注意 Ghostscript 为 AGPL（仅 OCR 时需要，子进程调用）</text>
<text x="990.0" y="750.0" font-size="12.2" font-weight="400" fill="#92400e" text-anchor="start" style="white-space:pre">• 注意 docxtpl / img2pdf / cairosvg 为 LGPL（不修改即可）</text>
<text x="990.0" y="776.0" font-size="12.2" font-weight="400" fill="#92400e" text-anchor="start" style="white-space:pre">• 注意 HarmonyOS Sans 为华为专有许可（需声明，法务确认）</text>
