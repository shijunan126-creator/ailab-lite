<text x="500.0" y="660.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">仿宋</text>
<text x="690.0" y="660.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">→  朱雀仿宋</text>
