<text x="250.0" y="694.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">→  Carlito / Caladea</text>
<text x="500.0" y="694.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">Arial / Times New Roman</text>
<text x="690.0" y="694.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">→  Liberation Sans / Serif</text>
<text x="60.0" y="742.0" font-size="12.2" font-weight="400" fill="#92400e" text-anchor="start" style="white-space:pre">生成文件时在 OOXML 里写真实的微软字体名（微软雅黑 / 等线），员工用 Office 打开时显示正常；</text>
<text x="60.0" y="764.0" font-size="12.2" font-weight="400" fill="#92400e" text-anchor="start" style="white-space:pre">没有开源字体与宋体 / 雅黑度量完全一致 → 服务器预览可能有轻微换行差异，以版式自检截图为准。</text>
