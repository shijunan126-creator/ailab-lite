  <path d="M900,138 L900,174" class="ln" marker-end="url(#arr)"/>
  <!-- higress -> portal / api -->
  <path d="M235,244 L235,282" class="ln" marker-end="url(#arr)"/>
  <path d="M479,244 L479,282" class="ln" marker-end="url(#arr)"/>
  <!-- portal OIDC -> keycloak -->
