  <!-- ============ Principles footer ============ -->
  <rect x="20" y="990" width="1560" height="120" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="36" y="1018" font-size="15" font-weight="700" fill="#713f12">设计原则</text>
  <g font-size="13.5" fill="#422006">
    <text x="36" y="1044">① 两个资源池解耦：沙箱跑在鲲鹏、不占 NPU，经网关调用模型</text>
    <text x="36" y="1068">② Agent 循环在沙箱外：沙箱只是“手”，零密钥、默认禁止出网</text>
    <text x="36" y="1092">③ 会话永久、沙箱即用即弃：最终产出每轮归档到资料库，中间文件随沙箱销毁</text>
    <text x="800" y="1044">④ 核心业务自建（用户/配额/资料库/Agent），基础设施全开源（Apache/MIT）</text>
    <text x="800" y="1068">⑤ 生产优先：版本锁定、灰度升级，实验特性（如沙箱暂停/恢复）不进关键路径</text>
    <text x="800" y="1092">⑥ 业务计量在平台（精确到会话），流量保护在网关（限流/指标）</text>
  </g>
</svg>
