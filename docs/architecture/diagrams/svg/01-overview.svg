  <path d="M920,244 L920,262 L1368,262 L1368,614 L1342,614" class="lnB" marker-end="url(#arrB)"/>
  <text x="1150" y="256" class="lblB">推理：Higress → Worker → vLLM</text>
  <!-- api -> pg -->
  <path d="M440,406 L440,432 L640,432 L640,476" class="ln" marker-end="url(#arr)"/>
  <!-- api/broker -> S3 library -->
  <path d="M370,406 L370,416 L30,416 L30,960 L520,960 L520,942" class="ln" marker-end="url(#arr)"/>
  <text x="36" y="976" class="lbl">资料库读写（Platform API / Broker，预签名直传）</text>
  <!-- atlas -> nfs -->
  <path d="M1030,806 L1030,814 L300,814 L300,860" class="lnO" marker-end="url(#arrO)"/>
