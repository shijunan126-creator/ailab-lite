<text x="555.0" y="641.0" font-size="10.5" font-weight="400" fill="#0e7490" text-anchor="middle" style="white-space:pre">沙箱 #1 存活期（占用 CPU/内存）</text>
<rect x="1130" y="630" width="300" height="14" rx="4" ry="4" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
<text x="1280.0" y="641.0" font-size="10.5" font-weight="400" fill="#0e7490" text-anchor="middle" style="white-space:pre">沙箱 #2</text>
<text x="1015.0" y="641.0" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle" style="white-space:pre">会话一直存在，不占计算资源</text>
<rect x="20" y="704" width="720" height="180" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="34.0" y="728.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">③ 回收触发条件</text>
<text x="40.0" y="752.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 闲置超时：Run 结束后 15 min 没有新 Run（可配置）</text>
<text x="40.0" y="776.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 最长时限：单个沙箱 4 h（到点前 10 min 提醒 Agent 交付）</text>
<text x="40.0" y="800.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 用户超限：普通用户只允许 1 个活跃沙箱 → 回收其闲置沙箱（LRU）</text>
<text x="40.0" y="824.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 异常：OOM / 节点故障 / execd 失联 → 标记失效，下一次调用时自动重建</text>
<text x="40.0" y="848.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 管理员：容量告急时手动或按策略回收闲置沙箱</text>
<rect x="760" y="704" width="720" height="180" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="774.0" y="728.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">④ 双保险，防止沙箱泄漏</text>
<rect x="780" y="744" width="320" height="120" rx="8" ry="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="940.0" y="778.1" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Broker Reaper（主动）</text>
<text x="940.0" y="800.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">选主后单实例运行，每 30s 扫描</text>
<text x="940.0" y="818.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">租约到期 → 归档 → 删除</text>
<text x="940.0" y="837.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">数据库记录销毁原因</text>
<rect x="1140" y="744" width="320" height="120" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1300.0" y="778.1" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">OpenSandbox expireAt（被动）</text>
