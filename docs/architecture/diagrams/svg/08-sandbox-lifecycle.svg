<circle cx="470" cy="590" r="7" fill="#15803d" stroke="#15803d" stroke-width="1.5"/>
<text x="470.0" y="546.0" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle" style="white-space:pre">10:02～10:20</text>
<text x="470.0" y="566.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle" style="white-space:pre">多次工具调用</text>
