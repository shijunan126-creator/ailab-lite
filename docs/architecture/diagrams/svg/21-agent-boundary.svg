<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
<defs><marker id="m15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1500" height="860" fill="#ffffff"/>
<text x="30.0" y="42.0" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" style="white-space:pre">Agent 的权限边界</text>
<text x="256.4" y="42.0" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start" style="white-space:pre">Agent 循环在沙箱外，但模型只能“选工具、填参数”；代码只在本 Run 的沙箱里执行</text>
<rect x="1212.0" y="24" width="16" height="12" rx="2" ry="2" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="1234.0" y="35.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">自建服务</text>
<rect x="1288.0" y="24" width="16" height="12" rx="2" ry="2" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1310.0" y="35.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">开源组件</text>
<rect x="1364.0" y="24" width="16" height="12" rx="2" ry="2" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1386.0" y="35.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">沙箱</text>
<rect x="1417.0" y="24" width="16" height="12" rx="2" ry="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="1439.0" y="35.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">禁止</text>
<rect x="30" y="110" width="210" height="130" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="135.0" y="149.2" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">模型（经 Higress）</text>
<text x="135.0" y="171.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">只能输出：一段文本，</text>
<text x="135.0" y="189.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">或 工具名 + JSON 参数</text>
<text x="135.0" y="208.2" font-size="12" font-weight="400" fill="#dc2626" text-anchor="middle" style="white-space:pre">自己不能执行任何东西</text>
<path d="M240.0,175.0 L268.0,175.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<rect x="270" y="70" width="620" height="570" rx="10" ry="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
<text x="284.0" y="94.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">Agent Service Pod（我们的代码）</text>
<rect x="290" y="110" width="280" height="120" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="430.0" y="144.2" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Run A（用户甲）</text>
<text x="430.0" y="166.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">上下文：用户 · 会话 · run_id</text>
<text x="430.0" y="184.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">沙箱句柄 A + 令牌 A</text>
<text x="430.0" y="203.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">工具参数里没有 sandbox_id</text>
<rect x="590" y="110" width="280" height="120" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="730.0" y="144.2" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Run B（用户乙）</text>
<text x="730.0" y="166.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">上下文：用户 · 会话 · run_id</text>
<text x="730.0" y="184.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">沙箱句柄 B + 令牌 B</text>
<text x="730.0" y="203.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">工具参数里没有 sandbox_id</text>
<rect x="290" y="254" width="580" height="120" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="580.0" y="288.1" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">工具 = 写死的函数，模型只能填参数</text>
<text x="580.0" y="310.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">沙箱工具：bash · run_python · read/write_file → 发给本 Run 的沙箱执行</text>
<text x="580.0" y="328.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">沙箱外工具：library_* · deliver_file · ocr_extract · web_fetch · ask_user</text>
<text x="580.0" y="347.2" font-size="12" font-weight="400" fill="#dc2626" text-anchor="middle" style="white-space:pre">Agent Service 里不调用 subprocess / eval，不执行模型给的代码</text>
<rect x="290" y="398" width="280" height="112" rx="8" ry="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="430.0" y="437.4" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">OpenSandboxBackend ✓</text>
<text x="430.0" y="459.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">唯一允许的后端（继承 BaseSandbox）</text>
<text x="430.0" y="478.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">文件和命令都转成 execd 调用</text>
<rect x="590" y="398" width="280" height="112" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="730.0" y="428.1" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">本机后端 ✗</text>
<text x="730.0" y="450.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">FilesystemBackend：读写本机磁盘</text>
<text x="730.0" y="468.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">LocalShellBackend：本机执行命令</text>
<text x="730.0" y="487.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">CI 禁止 import · 启动自检</text>
<text x="290.0" y="540.0" font-size="12.3" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">Pod 加固：runc · 非 root · 只读根文件系统 · 去掉全部 capabilities · seccomp</text>
<text x="290.0" y="564.0" font-size="12.3" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">只挂一个调用 Platform API 内部接口用的 SA Token</text>
<text x="290.0" y="600.0" font-size="12.3" font-weight="700" fill="#c2410c" text-anchor="start" style="white-space:pre">剩余风险：Agent Service 本身被攻破 → 它手上的 Run 都受影响</text>
<text x="290.0" y="622.0" font-size="12.3" font-weight="400" fill="#c2410c" text-anchor="start" style="white-space:pre">→ 当作可信核心：不在里面跑不可信代码，依赖锁版本并扫描</text>
<rect x="960" y="104" width="230" height="140" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1075.0" y="148.2" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">OpenSandbox ingress 网关</text>
<text x="1075.0" y="170.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">Secure Access：</text>
<text x="1075.0" y="188.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">核对每个沙箱自己的令牌</text>
<text x="1075.0" y="207.2" font-size="12" font-weight="400" fill="#c2410c" text-anchor="middle" style="white-space:pre">默认关闭，必须显式开启</text>
<path d="M890.0,160.0 L958.0,160.0" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#m15803d)"/>
<rect x="895.85" y="139.5" width="56.3" height="16.5" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="0" fill-opacity="0.9"/>
<text x="924.0" y="150.0" font-size="11.5" font-weight="400" fill="#15803d" text-anchor="middle" style="white-space:pre">带令牌 A</text>
<rect x="1260" y="84" width="210" height="84" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1365.0" y="118.7" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">沙箱 A（Kata）</text>
<text x="1365.0" y="140.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">用户甲 · 无网 · 无密钥</text>
<rect x="1260" y="200" width="210" height="84" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1365.0" y="234.7" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">沙箱 B（Kata）</text>
<text x="1365.0" y="256.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">用户乙 · 无网 · 无密钥</text>
<path d="M1190.0,140.0 L1258.0,126.0" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#m15803d)"/>
<rect x="1216.55" y="113.5" width="14.899999999999999" height="16.5" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="0" fill-opacity="0.9"/>
<text x="1224.0" y="124.0" font-size="11.5" font-weight="400" fill="#15803d" text-anchor="middle" style="white-space:pre">✓</text>
<path d="M1190.0,210.0 L1258.0,242.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mdc2626)"/>
<rect x="1192.7" y="203.5" width="58.599999999999994" height="16.5" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="0" fill-opacity="0.9"/>
<text x="1222.0" y="214.0" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="middle" style="white-space:pre">令牌 A ✗</text>
<path d="M890.0,318.0 L1365.0,318.0 L1365.0,286.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mdc2626)"/>
<rect x="1005.5999999999999" y="299.5" width="228.8000000000001" height="16.5" rx="3" ry="3" fill="#ffffff" stroke="none" stroke-width="0" fill-opacity="0.9"/>
<text x="1120.0" y="310.0" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="middle" style="white-space:pre">直连沙箱 Pod IP ✗（NetworkPolicy）</text>
<rect x="960" y="352" width="510" height="74" rx="8" ry="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="1215.0" y="381.5" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Platform API /internal</text>
<text x="1215.0" y="403.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">按 run_id 校验：别人的 file_id 被拒</text>
<path d="M890.0,389.0 L958.0,389.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<rect x="960" y="444" width="510" height="74" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1215.0" y="473.5" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">Higress 模型网关</text>
<text x="1215.0" y="495.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">服务 API Key · 按人 TPM 限流</text>
<path d="M890.0,481.0 L958.0,481.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<rect x="960" y="536" width="510" height="74" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1215.0" y="565.5" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">出网代理（web_fetch）</text>
<text x="1215.0" y="587.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">不带凭据 · 域名白名单 · 拒绝内网网段</text>
<path d="M890.0,573.0 L958.0,573.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<rect x="20" y="660" width="1460" height="186" rx="10" ry="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
<text x="34.0" y="684.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">被提示注入时，Agent 最多能做什么（仍然只是“以这个用户的身份、在这个 Run 里调用工具”）</text>
<text x="44.0" y="712.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 在沙箱里执行任意命令 → 只在这个用户自己的 Kata 沙箱里，无网、无密钥、有资源上限</text>
<text x="44.0" y="746.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 读别人的文件 → Platform API 按 run_id 校验归属，拒绝</text>
<text x="44.0" y="780.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 操作别人的沙箱 → 选不了（无 sandbox_id 参数）、没令牌、网络不通</text>
<text x="760.0" y="712.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 把数据发出去 → 沙箱不能出网；web_fetch 只能 GET 白名单域名；外部写操作要 ask_user 确认</text>
<text x="760.0" y="746.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 用 web_fetch 打内部服务（SSRF）→ 独立 HTTP 客户端、无凭据、经代理、内网网段被拒</text>
<text x="760.0" y="780.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 无限循环刷 Token → 单 Run 80 步 / 60 min / Token 上限；网关按人 TPM；平台日/月额度</text>
<text x="44.0" y="822.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">子 Agent（task）共用同一个 Run 的上下文和沙箱，权限不会增加。</text>
</svg>
