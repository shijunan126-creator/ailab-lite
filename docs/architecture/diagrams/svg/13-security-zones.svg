<text x="1156.0" y="536.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">包镜像：devpi / Verdaccio（沙箱唯一出口）</text>
<text x="1156.0" y="558.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">出网代理 Squid：仅 Agent / 镜像 /</text>
