<text x="40.0" y="762.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 用户身份只在 Platform API 确认</text>
<text x="40.0" y="786.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 内部调用：SA Token + 只认 run_id</text>
<text x="40.0" y="810.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 密钥 OpenBao · etcd 静态加密</text>
<text x="400.0" y="736.0" font-size="14" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">数据</text>
<text x="400.0" y="762.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 模型 100% 本地部署，数据不出域</text>
<text x="400.0" y="786.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 预签名 URL：单对象 · 5 min</text>
<text x="400.0" y="810.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• TLS 传输 · 备份加密</text>
