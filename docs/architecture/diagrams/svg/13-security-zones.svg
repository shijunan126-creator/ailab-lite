<text x="620.0" y="524.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">出向访问：</text>
<text x="690.0" y="524.0" font-size="12.5" font-weight="400" fill="#dc2626" text-anchor="start" style="white-space:pre">平台区 ✕　智算区 ✕　存储区 ✕　运维/办公内网 ✕</text>
<text x="690.0" y="546.0" font-size="12.5" font-weight="400" fill="#dc2626" text-anchor="start" style="white-space:pre">公网 ✕（默认）</text>
<text x="800.0" y="546.0" font-size="12.5" font-weight="400" fill="#15803d" text-anchor="start" style="white-space:pre">内网包镜像 ✓</text>
<text x="620.0" y="568.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">入向访问：</text>
<text x="690.0" y="568.0" font-size="12.5" font-weight="400" fill="#15803d" text-anchor="start" style="white-space:pre">仅经 ingress 网关 + 单沙箱令牌 → execd</text>
<text x="620.0" y="596.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 非 root · 无 ServiceAccount Token · 无宿主机挂载</text>
<text x="620.0" y="618.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• egress sidecar：DNS 白名单 + nftables 默认拒绝（deny.always 屏蔽内网段）</text>
<text x="620.0" y="640.0" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 环境里没有任何密钥（模型 / S3 / 内部 API 都在沙箱外调用）</text>
<text x="60.0" y="466.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• K8s API · GPUStack UI · Grafana · Harbor</text>
<text x="60.0" y="490.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• Keycloak Admin · OpenSandbox 控制台</text>
<text x="60.0" y="514.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• Atlas / TaiShan SSH（经堡垒机）</text>
<text x="60.0" y="538.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 全部经 Keycloak OIDC + MFA，仅 ops 组</text>
<text x="60.0" y="562.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 操作全量审计</text>
