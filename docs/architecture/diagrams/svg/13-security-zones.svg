<text x="852.5" y="280.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">PostgreSQL · Valkey（仅平台命名空间可访问）</text>
<text x="660.0" y="334.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">NetworkPolicy：命名空间之间默认拒绝，按需放行</text>
