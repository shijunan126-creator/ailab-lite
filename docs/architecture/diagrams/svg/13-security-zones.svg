<text x="760.0" y="786.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• cosign 签名校验 · Trivy 扫描</text>
<text x="760.0" y="810.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 模型只收 safetensors + SHA256</text>
<text x="1120.0" y="736.0" font-size="14" font-weight="700" fill="#1e293b" text-anchor="start" style="white-space:pre">审计</text>
