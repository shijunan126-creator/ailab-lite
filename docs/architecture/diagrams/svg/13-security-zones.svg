<text x="1120.0" y="786.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 审计员与管理员职责分离</text>
<text x="1120.0" y="810.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 审计归档 S3 ≥ 1 年</text>
