<rect width="1500" height="780" fill="#ffffff"/>
<text x="30.0" y="42.0" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" style="white-space:pre">文件生命周期 · 资料库 ⇄ 沙箱</text>
<text x="400.4" y="42.0" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start" style="white-space:pre">输入和最终产出永久保存，中间文件随沙箱销毁</text>
<rect x="1184.5" y="24" width="16" height="12" rx="2" ry="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="1206.5" y="35.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">永久（资料库）</text>
<rect x="1295.0" y="24" width="16" height="12" rx="2" ry="2" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="1317.0" y="35.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">临时（沙箱）</text>
<rect x="1394.0" y="24" width="16" height="12" rx="2" ry="2" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="1416.0" y="35.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" style="white-space:pre">中转服务</text>
<rect x="20" y="62" width="430" height="560" rx="10" ry="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<text x="34.0" y="86.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">用户资料库（Pacific S3 · 永久）</text>
<rect x="44" y="106" width="382" height="120" rx="8" ry="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="235.0" y="140.3" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">输入文件</text>
<text x="235.0" y="162.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">用户上传 → 立即入库（自动）</text>
<text x="235.0" y="181.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">带会话关联、标签、SHA256</text>
<text x="235.0" y="199.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">u/{user}/files/{file}/{ver}</text>
<rect x="44" y="356" width="382" height="150" rx="8" ry="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="235.0" y="396.1" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">最终产出（带版本）</text>
<text x="235.0" y="418.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">report.pptx  v1 → v2 → v3</text>
<text x="235.0" y="436.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">关联：会话、Run、使用的模型</text>
<text x="235.0" y="455.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">可预览、下载、回退、另存为</text>
<text x="235.0" y="473.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">同名再次交付 = 新版本</text>
<rect x="44" y="246" width="382" height="90" rx="8" ry="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="235.0" y="274.6" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">其他历史文件</text>
<text x="235.0" y="296.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">Agent 按需检索：library_search</text>
<text x="235.0" y="315.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">并拉取：library_fetch</text>
<rect x="44" y="526" width="382" height="80" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="235.0" y="558.5" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">配额 20 GB · 回收站 30 天</text>
<text x="235.0" y="580.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">历史版本最多 10 个 · 计入配额</text>
<rect x="490" y="62" width="420" height="560" rx="10" ry="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
<text x="504.0" y="86.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">Sandbox Broker（中转，不落盘）</text>
<rect x="514" y="100" width="372" height="128" rx="8" ry="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="700.0" y="128.9" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">领取沙箱时：注入</text>
<text x="700.0" y="151.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">向 Platform API 取本会话文件清单</text>
<text x="700.0" y="169.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">（输入 + 每个产出的最新版本，已校验归属）</text>
<text x="700.0" y="188.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">按清单从 S3 流式读出 → execd 写入</text>
<text x="700.0" y="206.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">单次 ≤ 1 GB，单文件 ≤ 200 MB</text>
<rect x="514" y="240" width="372" height="110" rx="8" ry="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="700.0" y="269.1" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">运行中：按需拉取</text>
<text x="700.0" y="291.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">Agent 调用 library_fetch</text>
<text x="700.0" y="309.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">Platform API 校验 file_id 归属</text>
<text x="700.0" y="328.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">经 execd 文件接口写入 inputs/</text>
<rect x="514" y="362" width="372" height="146" rx="8" ry="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="700.0" y="399.9" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">交付 / 兜底归档</text>
<text x="700.0" y="422.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">deliver_file 立即归档；Run 结束 / 释放前兜底</text>
<text x="700.0" y="440.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">① prepare：Platform API 去重、查配额、</text>
<text x="700.0" y="459.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">    分配版本号（不足则拒绝，不写 S3）</text>
<text x="700.0" y="477.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" style="white-space:pre">② 流式写 S3　③ commit：登记版本</text>
<rect x="514" y="520" width="372" height="86" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="700.0" y="546.2" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" style="white-space:pre">安全边界</text>
<text x="700.0" y="568.2" font-size="12" font-weight="400" fill="#dc2626" text-anchor="middle" style="white-space:pre">沙箱不挂载存储，也不持有 S3 凭据</text>
<text x="700.0" y="586.8" font-size="12" font-weight="400" fill="#dc2626" text-anchor="middle" style="white-space:pre">Broker 只搬运；归属判定只在 Platform API</text>
<rect x="950" y="62" width="530" height="560" rx="10" ry="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
<text x="964.0" y="86.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">沙箱 /workspace（Kata VM · 临时）</text>
<rect x="974" y="106" width="482" height="90" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="986.0" y="143.8" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" style="white-space:pre">/workspace/inputs/</text>
<text x="986.0" y="166.0" font-size="12" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">注入的输入文件（约定只读）</text>
<rect x="974" y="216" width="482" height="170" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="986.0" y="266.1" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" style="white-space:pre">/workspace/ 其他目录（工作区）</text>
<text x="986.0" y="288.2" font-size="12" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">extract.py · build_slides.js · tmp.png</text>
<text x="986.0" y="306.8" font-size="12" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">slide_render/*.png（版式自检截图）</text>
<text x="986.0" y="325.2" font-size="12" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">~/.cache · pip cache · LibreOffice profile</text>
<text x="986.0" y="343.8" font-size="12" font-weight="400" fill="#dc2626" text-anchor="start" style="white-space:pre">→ 沙箱销毁即全部消失，不进入资料库</text>
<rect x="974" y="406" width="482" height="100" rx="8" ry="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="986.0" y="439.6" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" style="white-space:pre">/workspace/outputs/</text>
<text x="986.0" y="461.8" font-size="12" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">最终产出：final.pptx、report.docx、analysis.xlsx</text>
<text x="986.0" y="480.2" font-size="12" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">约定：只有这里的文件会被归档</text>
<rect x="974" y="526" width="482" height="80" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="986.0" y="558.5" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" style="white-space:pre">/opt/skills/（只读，随镜像发布）</text>
<text x="986.0" y="580.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start" style="white-space:pre">SKILL.md · 脚本 · 公司模板 · 字体</text>
