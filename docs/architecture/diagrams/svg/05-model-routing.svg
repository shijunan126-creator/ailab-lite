<rect x="1226" y="448" width="238" height="92" rx="8" ry="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
<text x="1240.0" y="474.0" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start" style="white-space:pre">ailab-ocr 不可用</text>
<text x="1240.0" y="498.0" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">→ ailab-chat（多模态）</text>
<rect x="1226" y="558" width="238" height="92" rx="8" ry="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
<text x="1240.0" y="584.0" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start" style="white-space:pre">ailab-embed 不可用</text>
<text x="1240.0" y="608.0" font-size="13" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">→ 检索降级为关键词</text>
<text x="1226.0" y="680.0" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start" style="white-space:pre">连接失败 / 5xx / 首 token 超时才切换，</text>
<text x="1226.0" y="700.0" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start" style="white-space:pre">已开始输出的流不中途换模型；</text>
<text x="1226.0" y="720.0" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start" style="white-space:pre">界面提示“已切换模型”，按实际模型计量。</text>
<text x="1226.0" y="740.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" style="white-space:pre">（Higress 无“失败换模型”插件）</text>
<rect x="20" y="744" width="1180" height="104" rx="10" ry="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
<text x="34.0" y="768.0" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="white-space:pre">规则</text>
<text x="40.0" y="790.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 别名 = GPUStack 里的模型名 / 模型路由名，由 GPUStack 写进 Higress；部署名带版本（如 dsv41flash-w8a8-r20260910），换版本在 GPUStack 里切。</text>
<text x="40.0" y="814.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• 同一 Run 内尽量不切模型（前缀缓存会失效）；子 Agent / 摘要等“旁路调用”可以用更小的模型。</text>
<text x="40.0" y="838.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" style="white-space:pre">• Work 默认档位在 P0 评测后确定：若 27B 在评测集上成功率接近 DeepSeek，则默认“标准”，DeepSeek 留给复杂任务。</text>
</svg>
